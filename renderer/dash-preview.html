<!-- Standalone mockup of the "Dashboard" (Bugatti-style) skin. Not wired into the app yet. -->
<div style="background:#0a0c10;display:flex;align-items:flex-start;justify-content:center;padding:24px;min-height:380px;">
  <div id="dash"></div>
</div>
<style>
  #dash {
    width: 400px; border-radius: 16px; padding: 2px;
    background:
      repeating-linear-gradient(45deg,#0b0d11 0 3px,#0f1218 3px 6px),
      repeating-linear-gradient(-45deg,#0b0d11 0 3px,#0f1218 3px 6px), #0b0d11;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 0 1px #23282f;
    font-family: "Avenir Next Condensed","Helvetica Neue",sans-serif;
  }
  #dash svg { display:block; width:100%; }
</style>
<script>
  const D2R = Math.PI/180;
  const onC = (cx,cy,r,a) => [cx + r*Math.cos((a-90)*D2R), cy + r*Math.sin((a-90)*D2R)];
  const A0 = 225, SWEEP = 270;
  const angAt = p => A0 + (Math.max(0,Math.min(100,p))/100)*SWEEP;

  const ICONS = {
    R: 'M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5',
    pulse: 'M2 12h4l2.5-6 4 12 2.5-6H22',
    pin: 'M9 3h6l-1 6 3 3v2h-4v5l-1 2-1-2v-5H6v-2l3-3z',
    dock: 'M3 4h18v16H3zM13 13h6v6h-6z',
    gear: 'M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7M12 2l1.5 3h-3zM12 22l-1.5-3h3zM2 12l3-1.5v3zM22 12l-3 1.5v-3z',
    X: 'M5 5l14 14M19 5L5 19',
  };
  function ctrlBtn(x, key) {
    return `<circle cx="${x}" cy="304" r="12.5" fill="url(#hub)" stroke="#2a2f36"/>
      <g transform="translate(${x-8},296) scale(0.665)"><path d="${ICONS[key]}" fill="none" stroke="#12161d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  }

  function gauge(cx, cy, r, pct, label, digit, sub, big) {
    const redline = 90;
    let s = '';
    for (let p = 0; p <= 100; p += (big ? 2 : 5)) {
      const a = angAt(p), major = p % 20 === 0;
      const [x1,y1] = onC(cx,cy, r-(major?12:6), a);
      const [x2,y2] = onC(cx,cy, r-1, a);
      const col = p >= redline ? '#ff3b30' : (major ? '#eef3f8' : '#828c98');
      s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${major?2:1}"/>`;
      if (major && big && p!==0 && p!==100) { const [nx,ny] = onC(cx,cy, r-23, a); s += `<text x="${nx.toFixed(1)}" y="${(ny+3).toFixed(1)}" fill="#aab4c0" font-size="9" text-anchor="middle">${p}</text>`; }
    }
    const [rx0,ry0] = onC(cx,cy, r-1, angAt(redline));
    const [rx1,ry1] = onC(cx,cy, r-1, angAt(100));
    s += `<path d="M ${rx0.toFixed(1)} ${ry0.toFixed(1)} A ${r-1} ${r-1} 0 0 1 ${rx1.toFixed(1)} ${ry1.toFixed(1)}" fill="none" stroke="#ff3b30" stroke-width="3"/>`;
    // needle
    const a = angAt(pct);
    const [tx,ty] = onC(cx,cy, r-14, a);
    const [lx,ly] = onC(cx,cy, 3, a+90);
    const [rrx,rry] = onC(cx,cy, 3, a-90);
    const [tlx,tly] = onC(cx,cy, big?15:10, a+180);
    // label (top) + LCD window (bottom)
    const lw = big?70:46, lh = big?30:22, ly0 = cy + (big?30:24);
    return `
      <circle cx="${cx}" cy="${cy}" r="${r+7}" fill="none" stroke="url(#chrome)" stroke-width="9"/>
      <circle cx="${cx}" cy="${cy}" r="${r+2}" fill="url(#face)"/>
      <circle cx="${cx}" cy="${cy}" r="${r+2}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="2"/>
      ${s}
      <text x="${cx}" y="${(cy-r*0.5).toFixed(1)}" fill="#7d8894" font-size="${big?10:8}" text-anchor="middle" letter-spacing="2.5">${label}</text>
      <rect x="${cx-lw/2}" y="${ly0}" width="${lw}" height="${lh}" rx="4" fill="#071019" stroke="#1d3a56"/>
      <text x="${cx}" y="${ly0 + (big?18:14)}" fill="#84d6ff" font-size="${big?19:14}" font-weight="500" text-anchor="middle" letter-spacing="0.5">${digit}</text>
      ${sub ? `<text x="${cx}" y="${ly0 + lh - 4}" fill="#3f6f92" font-size="7" text-anchor="middle" letter-spacing="1">${sub}</text>` : ''}
      <polygon points="${lx.toFixed(1)},${ly.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} ${rrx.toFixed(1)},${rry.toFixed(1)} ${tlx.toFixed(1)},${tly.toFixed(1)}" fill="#ff3b30"/>
      <circle cx="${cx}" cy="${cy}" r="${big?7:5}" fill="url(#hub)" stroke="#2a2f36" stroke-width="1"/>`;
  }

  const svg = `<svg viewBox="0 0 400 332" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f4f7fa"/><stop offset="0.35" stop-color="#aeb7c2"/>
        <stop offset="0.55" stop-color="#5c646f"/><stop offset="0.75" stop-color="#89929d"/><stop offset="1" stop-color="#d6dde5"/>
      </linearGradient>
      <radialGradient id="face" cx="0.5" cy="0.4" r="0.68">
        <stop offset="0" stop-color="#161b23"/><stop offset="0.7" stop-color="#0a0e14"/><stop offset="1" stop-color="#04060a"/>
      </radialGradient>
      <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#6b7480"/></linearGradient>
      <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3138"/><stop offset="1" stop-color="#161a1f"/></linearGradient>
    </defs>

    <rect x="12" y="12" width="376" height="30" rx="8" fill="url(#bar)" stroke="#3a4149"/>
    <text x="26" y="32" fill="#e8edf2" font-size="15" font-weight="500" letter-spacing="2">CLAUDE USAGE</text>
    <text x="374" y="31" fill="#9aa4b0" font-size="12" text-anchor="end" letter-spacing="1">MAX 5X</text>

    ${gauge(132, 162, 86, 13, 'SESSION', '13%', 'RESET 4H 16M', true)}
    ${gauge(312, 170, 58, 2, 'WEEKLY', '2%', 'TUE 16:00', false)}

    ${['R','pulse','pin','dock','gear','X'].map((k,i)=>ctrlBtn(72 + i*51, k)).join('')}
    <text x="388" y="308" fill="#4a515b" font-size="8" text-anchor="end">LIVE 2M</text>
  </svg>`;
  document.getElementById('dash').innerHTML = svg;
</script>
